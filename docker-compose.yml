services:
  postgres:
    image: postgres:16
    container_name: cupo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - cupo_postgres_data:/var/lib/postgresql/data

volumes:
  cupo_postgres_data:
